name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 are the supported lines. 20 is past upstream end-of-life but
        # still common on VPS images, and package.json claims it works, so it
        # gets tested rather than assumed.
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Unit tests only. The solve tests need a browser and a live target.
      - run: npm test

      - name: Check every source file parses
        run: |
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
