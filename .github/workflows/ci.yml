name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Unit tests only. The solve tests need a browser and a live target.
      - run: npm test

      - name: Check every source file parses
        run: |
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
